version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: cafevideo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cafevideo
      MYSQL_USER: cafeuser
      MYSQL_PASSWORD: cafepassword
      TZ: America/Lima
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: